[pytest]
testpaths = tests
asyncio_mode = auto
# One loop for the whole session, so the connection pool survives between
# tests. pytest-asyncio 0.25 has no ini option for test loop scope, so each
# async test module also carries `pytestmark = pytest.mark.asyncio(
# loop_scope="session")`.
asyncio_default_fixture_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
